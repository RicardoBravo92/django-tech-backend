services:
  db:
    image: postgres:17-alpine
    container_name: tech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tech_password}
      POSTGRES_DB: ${POSTGRES_DB:-tech_django}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tech} -d ${POSTGRES_DB:-tech_django}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tech_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tech}:${POSTGRES_PASSWORD:-tech_password}@db:5432/${POSTGRES_DB:-tech_django}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-to-a-long-random-string-32b-min}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run --no-dev python manage.py migrate &&
             uv run --no-dev gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2}"

volumes:
  postgres_data:
